# Runs on every push and pull request. Uses SYNTHETIC data only - the real SEER/GENIE files never reach GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  data-safety:
    name: No patient data in the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a CSV / pickle / raw data file is committed
        run: |
          bad=$(git ls-files | grep -Ei '\.(csv|pkl|parquet|tsv)$|genie_bpc_crc' || true)
          if [ -n "$bad" ]; then echo "Patient-level data must not be committed:"; echo "$bad"; exit 1; fi
          echo "OK - no data files tracked by Git"

  test:
    name: Pipeline + app tests (synthetic data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt mlflow==3.17.0 pyyaml pytest
      - name: Byte-compile
        run: python -m compileall -q src app tests
      - name: prepare -> train -> evaluate -> registry -> Flask app
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: docker build (model files are not in Git, so this only checks the Dockerfile)
        run: docker build -t crc-survival:ci .
